name: Deploy (live)

# Builds the Flutter web app + admin panel against LIVE Firebase and deploys
# both to Firebase Hosting. It also builds the release Android APK and publishes
# it to the app's Hosting site as a public, direct download at
#   https://kafi-app-8acbe.web.app/kafi.apk
# so testers can install without a GitHub login or an expiring Actions artifact.
# All credentials come from encrypted GitHub Actions secrets (Settings → Secrets
# and variables → Actions) — never from the repo.
#
# Required secrets:
#   FIREBASE_PROJECT_ID          your Firebase project id
#   FIREBASE_SA_JSON_B64         base64 of a deploy service-account JSON
#   VITE_FIREBASE_API_KEY        \
#   VITE_FIREBASE_AUTH_DOMAIN     |
#   VITE_FIREBASE_PROJECT_ID      | Firebase Web app config (drives both the
#   VITE_FIREBASE_STORAGE_BUCKET  | Flutter web firebase_options.dart and the
#   VITE_FIREBASE_MESSAGING_SENDER_ID |  admin panel .env)
#   VITE_FIREBASE_APP_ID         /
#   GOOGLE_MAPS_API_KEY          Maps JS/Places/Geocoding key (optional)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_apk:
        description: 'Rebuild the Android APK from source (default: reuse the currently published kafi.apk)'
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build + deploy hosting
    needs: test
    runs-on: ubuntu-latest
    # The deploy secrets live in the "FIREBASE_PROJECT_ID" GitHub Environment
    # (Settings → Environments). A job only receives an environment's secrets
    # when it declares that environment here — without this, secrets.* resolves
    # empty and the guard below skips the deploy.
    environment: FIREBASE_PROJECT_ID
    steps:
      # fetch-depth: 2 so the APK step can diff HEAD^..HEAD to decide whether
      # the app itself changed (and thus needs a fresh APK build).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Cleanly skip (green, not red) until the deploy secrets are configured.
      # Prints a presence report (booleans only — never the values) so a skipped
      # deploy tells you exactly which secrets Actions can and cannot see.
      - name: Guard — only deploy when secrets are set
        id: guard
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SA_JSON_B64: ${{ secrets.FIREBASE_SA_JSON_B64 }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          echo "Secret visibility for this run (values hidden):"
          present=0; missing=0
          # Deploy auth needs EITHER FIREBASE_SA_JSON_B64 OR FIREBASE_TOKEN.
          for name in FIREBASE_PROJECT_ID FIREBASE_SA_JSON_B64 FIREBASE_TOKEN \
                      VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN \
                      VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET \
                      VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID \
                      GOOGLE_MAPS_API_KEY; do
            if [ -n "${!name:-}" ]; then
              echo "  ✓ $name present"; present=$((present+1))
            else
              echo "  ✗ $name MISSING"; missing=$((missing+1))
            fi
          done
          echo "summary: $present present, $missing missing"
          if [ -z "${FIREBASE_SA_JSON_B64:-}" ] && [ -z "${FIREBASE_TOKEN:-}" ]; then
            echo "::warning title=No deploy credential::Neither FIREBASE_SA_JSON_B64 nor FIREBASE_TOKEN is set — the deploy step will fail to authenticate. Add one of them to the FIREBASE_PROJECT_ID environment."
          fi
          if [ -z "${FIREBASE_PROJECT_ID:-}" ]; then
            echo "::warning title=Deploy skipped::FIREBASE_PROJECT_ID is not visible to Actions. Add the deploy secrets under Settings → Secrets and variables → Actions → Secrets (repository level — NOT the Variables tab, and NOT scoped to an Environment unless the job declares it)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "FIREBASE_PROJECT_ID visible — proceeding with build + deploy."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize live config from secrets
        if: steps.guard.outputs.skip != 'true'
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          FIREBASE_SA_JSON_B64: ${{ secrets.FIREBASE_SA_JSON_B64 }}
        run: bash scripts/materialize-secrets.sh

      # Java is required for the Gradle/Android APK build below. cache: gradle
      # persists ~/.gradle across runs so a real APK rebuild is fast (the cold
      # first build downloads Gradle + the Android toolchain; warm builds skip
      # most of it), keeping it well clear of any runner-reclaim window.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Build Flutter web (live)
        if: steps.guard.outputs.skip != 'true'
        working-directory: kafi_app
        run: |
          flutter pub get
          # --source-maps emits main.dart.js.map so obfuscated release stack
          # traces resolve to real Dart frames in the browser console — needed
          # to diagnose runtime errors on the deployed site.
          flutter build web --release --source-maps

      # Stage kafi.apk inside the web build output so it deploys with Hosting as
      # a public, direct download at /kafi.apk. Rebuilding the APK is a slow
      # (~15 min) Gradle build, so we only do it when the app itself changed
      # (pubspec.yaml version/deps) or when explicitly requested via
      # workflow_dispatch. Otherwise we carry the already-published APK forward
      # by fetching it from the live site — Firebase Hosting deploys are atomic
      # (they replace the whole site), so the file must be present each deploy.
      # Uses the SAME firebase_options.dart the web build uses (android = web).
      - name: Stage APK for Hosting (rebuild only when the app changed)
        if: steps.guard.outputs.skip != 'true'
        working-directory: kafi_app
        env:
          LIVE_APK_URL: https://kafi-app-8acbe.web.app/kafi.apk
          REBUILD_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_apk }}
        run: |
          set -euo pipefail
          mkdir -p build/web
          rebuild=false
          if [ "${REBUILD_REQUESTED}" = "true" ]; then
            echo "APK rebuild requested via workflow_dispatch."
            rebuild=true
          elif git diff --name-only HEAD^ HEAD 2>/dev/null | grep -qx 'kafi_app/pubspec.yaml'; then
            echo "kafi_app/pubspec.yaml changed — rebuilding the APK."
            rebuild=true
          fi

          if [ "$rebuild" = "false" ]; then
            echo "Reusing the currently published APK from ${LIVE_APK_URL}"
            if curl -fsSL --retry 3 "${LIVE_APK_URL}" -o build/web/kafi.apk; then
              echo "Carried forward existing kafi.apk ($(du -h build/web/kafi.apk | cut -f1))"
            else
              echo "::notice::No published APK to reuse yet — building a fresh one."
              rebuild=true
            fi
          fi

          if [ "$rebuild" = "true" ]; then
            flutter build apk --release
            cp build/app/outputs/flutter-apk/app-release.apk build/web/kafi.apk
            echo "Built + staged kafi.apk ($(du -h build/web/kafi.apk | cut -f1))"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json
      - name: Build admin panel (live)
        if: steps.guard.outputs.skip != 'true'
        working-directory: admin-panel
        run: |
          npm ci
          npm run build

      - name: Deploy to Firebase Hosting + rules
        if: steps.guard.outputs.skip != 'true'
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          # firebase-tools auto-detects FIREBASE_TOKEN when no service account is
          # present, so you can authenticate with EITHER credential.
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm i -g firebase-tools
          SA="${{ github.workspace }}/scripts/service-account.json"
          if [ -f "$SA" ]; then
            export GOOGLE_APPLICATION_CREDENTIALS="$SA"
            echo "Deploy auth: service account (FIREBASE_SA_JSON_B64)."
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "Deploy auth: FIREBASE_TOKEN (firebase login:ci)."
          else
            echo "::error title=No deploy credential::Add EITHER FIREBASE_SA_JSON_B64 (base64 of a service-account key) OR FIREBASE_TOKEN (from 'firebase login:ci') to the FIREBASE_PROJECT_ID environment."
            exit 1
          fi
          firebase deploy \
            --only hosting,firestore:rules,firestore:indexes,storage \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
