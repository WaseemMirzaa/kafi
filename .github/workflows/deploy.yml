name: Deploy (live)

# Builds the Flutter web app + admin panel against LIVE Firebase and deploys
# both to Firebase Hosting. All credentials come from encrypted GitHub Actions
# secrets (Settings → Secrets and variables → Actions) — never from the repo.
#
# Required secrets:
#   FIREBASE_PROJECT_ID          your Firebase project id
#   FIREBASE_SA_JSON_B64         base64 of a deploy service-account JSON
#   VITE_FIREBASE_API_KEY        \
#   VITE_FIREBASE_AUTH_DOMAIN     |
#   VITE_FIREBASE_PROJECT_ID      | Firebase Web app config (drives both the
#   VITE_FIREBASE_STORAGE_BUCKET  | Flutter web firebase_options.dart and the
#   VITE_FIREBASE_MESSAGING_SENDER_ID |  admin panel .env)
#   VITE_FIREBASE_APP_ID         /
#   GOOGLE_MAPS_API_KEY          Maps JS/Places/Geocoding key (optional)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build + deploy hosting
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Materialize live config from secrets
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          FIREBASE_SA_JSON_B64: ${{ secrets.FIREBASE_SA_JSON_B64 }}
        run: bash scripts/materialize-secrets.sh

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Build Flutter web (live)
        working-directory: kafi_app
        run: |
          flutter pub get
          flutter build web --release

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json
      - name: Build admin panel (live)
        working-directory: admin-panel
        run: |
          npm ci
          npm run build

      - name: Deploy to Firebase Hosting + rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/scripts/service-account.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          npm i -g firebase-tools
          firebase deploy \
            --only hosting,firestore:rules,firestore:indexes,storage \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
