name: Build APK

# Manually build an installable Android APK against LIVE Firebase and upload it
# as a downloadable artifact — for testing on a real device without a local
# Android SDK.
#
# No extra setup: this reuses the SAME Firebase secrets the web deploy uses
# (the VITE_FIREBASE_* values in the "FIREBASE_PROJECT_ID" GitHub Environment).
# scripts/materialize-secrets.sh generates firebase_options.dart on the runner,
# where the Android app config mirrors the web app config. Nothing is committed.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build type'
        type: choice
        options: [release, debug]
        default: release

jobs:
  build:
    name: Flutter — build APK (live Firebase)
    runs-on: ubuntu-latest
    # Same environment as deploy.yml, so the VITE_FIREBASE_* secrets resolve.
    environment: FIREBASE_PROJECT_ID
    steps:
      - uses: actions/checkout@v4

      - name: Guard — Firebase web config is visible
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: |
          if [ -z "${VITE_FIREBASE_API_KEY:-}" ]; then
            echo "::error title=Missing Firebase config::VITE_FIREBASE_API_KEY (and the other VITE_FIREBASE_* secrets used by the web deploy) must be set in the FIREBASE_PROJECT_ID environment — Settings → Environments → FIREBASE_PROJECT_ID."
            exit 1
          fi
          echo "Firebase web config visible — building the Android APK with the same credentials."

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Match CI's pinned Flutter version for reproducible builds.
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Materialize live Firebase config from the web secrets
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: bash scripts/materialize-secrets.sh

      - name: Build APK (${{ inputs.mode }})
        working-directory: kafi_app
        run: |
          flutter pub get
          flutter build apk --${{ inputs.mode }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kafi-${{ inputs.mode }}-apk
          path: kafi_app/build/app/outputs/flutter-apk/app-${{ inputs.mode }}.apk
          if-no-files-found: error
          retention-days: 14
