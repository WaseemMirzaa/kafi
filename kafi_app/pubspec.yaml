name: kafi_app
description: UAE Nanny/Domestic Helper Marketplace
publish_to: 'none'
version: 2.2.2+24

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get: ^4.6.6
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  intl: ^0.20.2
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

  # Firebase (used only when AppConfig.useMock = false)
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  firebase_storage: ^14.0.1
  firebase_messaging: ^17.0.1

  # Error handling & permissions
  connectivity_plus: ^6.0.5
  permission_handler: ^11.3.1

  # Maps & location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2
  http: ^1.2.2
  url_launcher: ^6.3.0 # launch tel:/wa.me/mailto for the revealed nanny contact

  # Media — camera, gallery, files, video
  image_picker: ^1.1.2
  # Direct deps so we can enable Android's system Photo Picker (multi-select).
  image_picker_android: ^0.8.13
  image_picker_platform_interface: ^2.10.0
  file_picker: ^8.1.6
  video_player: ^2.9.2
  camera: ^0.11.0+2 # in-app intro-video recorder (4 min cap; OEMs ignore image_picker maxDuration)
  path_provider: ^2.1.4 # temp/app dirs for the mock storage service

  # Notifications — local display of FCM foreground messages
  flutter_local_notifications: ^18.0.1

  # Subscriptions — RevenueCat (public SDK keys via dart-define)
  purchases_flutter: ^10.14.0
  wakelock_plus: ^1.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Bundled for google_fonts with allowRuntimeFetching=false (Android JNI
  # crash if fonts are downloaded at runtime). Filenames must match Google
  # Fonts API names — do not rename.
  assets:
    - google_fonts/
    - assets/images/
    # pubspec asset directories are non-recursive — subfolders must be
    # listed explicitly or their files silently fail to bundle.
    - assets/images/family_defaults/
