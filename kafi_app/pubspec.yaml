name: kafi_app
description: UAE Nanny/Domestic Helper Marketplace
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  intl: ^0.20.2
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

  # Firebase (used only when AppConfig.useMock = false)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3

  # Error handling & permissions
  connectivity_plus: ^6.0.5
  permission_handler: ^11.3.1

  # Maps & location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2
  http: ^1.2.2
  url_launcher: ^6.3.0 # launch tel:/wa.me/mailto for the revealed nanny contact

  # Media — camera, gallery, files, video
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  video_player: ^2.9.2
  path_provider: ^2.1.4 # temp/app dirs for the mock storage service

  # Notifications — local display of FCM foreground messages
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
